---
clusterName: homelab
talosVersion: v1.14.5
kubernetesVersion: v1.35.10
endpoint: https://192.168.2.12:6443

imageFactory:
  # Talos 1.14 publishes installer images under the metal-installer path.
  installerURLTmpl: "{{.RegistryURL}}/metal-installer{{if .Secureboot}}-secureboot{{end}}/{{.ID}}:{{.Version}}"

cniConfig:
  name: none

controlPlane:
  schematic: &talosSchematic
    customization:
      systemExtensions:
        officialExtensions:
          - siderolabs/qemu-guest-agent
  imageSchematic: *talosSchematic
  filenameTmpl: "{{.Hostname}}.yaml"
  patches:
    - |-
      apiVersion: v1alpha1
      kind: KubeProxyConfig
      enabled: false
    - |-
      apiVersion: v1alpha1
      kind: KubeAuthenticationConfig
      configuration:
        jwt:
          - issuer:
              url: ${OIDC_ISSUER_URL}
              audiences:
                - ${OIDC_CLIENT_ID}
            claimMappings:
              username:
                claim: email
                prefix: ""
              groups:
                claim: groups
                prefix: ""

nodes:
  - hostname: k8s-cp-02
    ipAddress: 192.168.2.12
    controlPlane: true
    installDisk: /dev/sda
    ignoreHostname: true
    machineSpec: &machineSpec
      mode: metal
      arch: amd64
      secureboot: true
      bootMethod: iso
    nameservers: &nameservers
      - 192.168.0.1
    networkInterfaces:
      - interface: ens18
        addresses:
          - 192.168.2.12/20
        routes:
          - network: 0.0.0.0/0
            gateway: 192.168.1.1
    patches:
      - |-
        apiVersion: v1alpha1
        kind: HostnameConfig
        hostname: k8s-cp-02
        auto: off

  - hostname: k8s-wk-01
    ipAddress: 192.168.2.21
    controlPlane: false
    installDisk: /dev/sda
    ignoreHostname: true
    machineSpec: *machineSpec
    nameservers: *nameservers
    networkInterfaces:
      - interface: ens18
        addresses:
          - 192.168.2.21/20
        routes:
          - network: 0.0.0.0/0
            gateway: 192.168.1.1
    patches:
      - |-
        apiVersion: v1alpha1
        kind: HostnameConfig
        hostname: k8s-wk-01
        auto: off

  - hostname: k8s-wk-02
    ipAddress: 192.168.2.22
    controlPlane: false
    installDisk: /dev/sda
    ignoreHostname: true
    machineSpec: *machineSpec
    nameservers: *nameservers
    networkInterfaces:
      - interface: ens18
        addresses:
          - 192.168.2.22/20
        routes:
          - network: 0.0.0.0/0
            gateway: 192.168.1.1
    patches:
      - |-
        machine:
          disks:
            - device: /dev/sdb
              partitions:
                - mountpoint: /var/mnt/local-storage
          kubelet:
            extraMounts:
              - destination: /var/mnt/local-storage
                type: bind
                source: /var/mnt/local-storage
                options:
                  - bind
                  - rshared
                  - rw
      - |-
        apiVersion: v1alpha1
        kind: HostnameConfig
        hostname: k8s-wk-02
        auto: off

worker:
  schematic: *talosSchematic
  imageSchematic: *talosSchematic
  filenameTmpl: "{{.Hostname}}.yaml"
