apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gtnh
  namespace: minecraft
spec:
  interval: 30m
  chart:
    spec:
      chart: minecraft
      sourceRef:
        kind: HelmRepository
        name: itzg-minecraft
  values:
    serviceAnnotations:
      mc-router.itzg.me/externalServerName: "gtnh.constantan.dev"
      external-dns.alpha.kubernetes.io/hostname: "gtnh.i.constantan.dev"
    minecraftServer:
      eula: "TRUE"
      type: "GTNH"
      memory: "16G"
      serviceType: LoadBalancer
      rcon:
        enabled: true
    extraEnv:
      GTNH_PACK_VERSION: "2.8.4"
    resources:
      requests:
        memory: 18Gi
        cpu: "2"
      limits:
        memory: 24Gi
    persistence:
      storageClass: local-path
      dataDir:
        enabled: true
        Size: 50Gi
    startupProbe:
      enabled: true
      command:
        - mc-health
      initialDelaySeconds: 0
      periodSeconds: 10
      failureThreshold: 60
    podSecurityContext:
      fsGroupChangePolicy: OnRootMismatch
    nodeSelector:
      kubernetes.io/hostname: k8s-wk-02
