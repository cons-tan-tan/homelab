apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: gtnh-admin
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: gtnh-admin
  ingress:
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": wireguard
            "k8s:app": wireguard-gateway
      toPorts:
        - ports:
            - port: "2222"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            "k8s:k8s-app": kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # The API Service is backed by a host-network endpoint. Cilium's dedicated
    # entity remains correct across Service translation and control-plane moves.
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "6443"
              protocol: TCP
