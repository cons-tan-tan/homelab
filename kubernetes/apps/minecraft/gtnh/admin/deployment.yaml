apiVersion: apps/v1
kind: Deployment
metadata:
  name: gtnh-admin
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: gtnh-admin
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gtnh-admin
    spec:
      serviceAccountName: gtnh-admin
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 10
      # Pin both first consumers before local-path binds the PVC to a node.
      nodeSelector:
        kubernetes.io/hostname: k8s-wk-02
      securityContext:
        fsGroup: 2000
        fsGroupChangePolicy: OnRootMismatch
        supplementalGroups:
          - 3000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ssh
          # Keep the runtime immutable; update this digest manually after an
          # intentionally reviewed minecraft-admin image release.
          image: ghcr.io/cons-tan-tan/minecraft-admin:main@sha256:af0f262c278823fafc2ac14cb6b31f6157698eed74ac3f7e498b4968fddf33c3
          imagePullPolicy: IfNotPresent
          env:
            - name: MINECRAFT_DEPLOYMENT
              value: gtnh-minecraft
            - name: MINECRAFT_POD_SELECTOR
              value: app=gtnh-minecraft
            - name: MINECRAFT_RESTORE_ROOTS
              value: world visualprospecting
          ports:
            - name: ssh
              containerPort: 2222
              protocol: TCP
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - FOWNER
                - SETGID
                - SETUID
                - SYS_CHROOT
          volumeMounts:
            - name: data
              mountPath: /data
            - name: admin-config
              mountPath: /config
              readOnly: true
            - name: admin-config
              mountPath: /etc/ssh/sshd_config
              subPath: sshd_config
              readOnly: true
            - name: host-key
              mountPath: /host-key
              readOnly: true
            - name: home
              mountPath: /home/minecraft
            - name: runtime
              mountPath: /run/minecraft-admin
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: gtnh-minecraft-datadir
        - name: admin-config
          configMap:
            name: gtnh-admin-config
            defaultMode: 0444
        - name: host-key
          secret:
            secretName: gtnh-admin-host-key-v1
            defaultMode: 0400
        - name: home
          emptyDir:
            sizeLimit: 64Mi
        - name: runtime
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
