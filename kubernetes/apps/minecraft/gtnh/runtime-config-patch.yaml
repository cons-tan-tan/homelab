apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gtnh
  namespace: minecraft
spec:
  values:
    extraEnv:
      JVM_OPTS: "@/runtime-config/jvm.options"
      SKIP_GTNH_UPDATE_CHECK: "true"
    initContainers:
      - name: setup-gtnh
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: "{{ .Values.image.pullPolicy }}"
        env:
          - name: EULA
            value: "{{ .Values.minecraftServer.eula }}"
          - name: TYPE
            value: "{{ .Values.minecraftServer.type }}"
          - name: GTNH_PACK_VERSION
            value: "{{ .Values.extraEnv.GTNH_PACK_VERSION }}"
          - name: SETUP_ONLY
            value: "true"
        volumeMounts:
          - name: tmp
            mountPath: /tmp
          - name: datadir
            mountPath: /data
      - name: merge-forge-cfg
        # Publish this built image before reconciling the runtime manifests.
        image: ghcr.io/cons-tan-tan/forge-cfg:main@sha256:15d52a14b2e1aeb4a4c69662b0aec75a5fd406492d2932a2566f9b721d06e4b1
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        args:
          - --install
          - /minecraft-tools/forge-cfg
          - /data/serverutilities/serverutilities.cfg
          - /runtime-config/serverutilities.patch.cfg
        volumeMounts:
          - name: datadir
            mountPath: /data
          - name: runtime-config
            mountPath: /runtime-config
            readOnly: true
          - name: minecraft-tools
            mountPath: /minecraft-tools
    extraVolumes:
      - volumeMounts:
          - name: runtime-config
            mountPath: /runtime-config
            readOnly: true
          - name: minecraft-tools
            mountPath: /minecraft-tools
            readOnly: true
        volumes:
          - name: runtime-config
            configMap:
              name: gtnh-runtime-config
          - name: minecraft-tools
            emptyDir: {}
    startupProbe:
      command:
        - /bin/sh
        - -ec
        - >-
          mc-health &&
          /minecraft-tools/forge-cfg --check
          /data/serverutilities/serverutilities.cfg
          /runtime-config/serverutilities.patch.cfg
