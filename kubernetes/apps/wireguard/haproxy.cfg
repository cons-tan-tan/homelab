global
  log stdout format raw local0

defaults
  log global
  mode tcp
  option tcplog
  timeout connect 5s
  timeout client 1h
  timeout server 1h

frontend minecraft
  bind :25565
  default_backend minecraft-backend

frontend gtnh-admin-ssh
  bind :2222
  # Accept SSH only on the WireGuard address. Without this ACL, Pods could use
  # the gateway Pod IP and bypass the public gateway's per-client limits.
  tcp-request connection reject unless { dst 10.90.0.2 }
  # All connections arrive from the Linode gateway, so only enforce an
  # absolute cap here; per-client limits belong on the public HAProxy.
  maxconn 16
  default_backend gtnh-admin-ssh-backend

backend minecraft-backend
  option tcp-check
  server mc-router mc-router.minecraft.svc.cluster.local:25565 check inter 5s rise 2 fall 3

backend gtnh-admin-ssh-backend
  timeout queue 5s
  server gtnh-admin gtnh-admin.minecraft.svc.cluster.local:22 maxconn 16
