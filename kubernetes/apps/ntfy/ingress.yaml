apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ntfy
  namespace: ntfy
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    # Allow HTTP access from devices without TLS support, such as the Raspberry Pi Pico.
    # Browsers automatically use HTTPS because .dev is HSTS-preloaded.
    ingress.cilium.io/force-https: "disabled"
spec:
  tls:
    - hosts:
        - ntfy.constantan.dev
      secretName: ntfy-tls
  rules:
    - host: ntfy.constantan.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ntfy
                port:
                  number: 80
