[project]
name = "homelab"
revision = "1.0"

[providers]
sops = "sops://secrets/secretspec.sops.yaml"

[profiles.default.defaults]
providers = ["sops"]

[profiles.default]
PROXMOX_VE_API_TOKEN = { description = "Proxmox VE API token", required = true }
CLOUDFLARE_API_TOKEN = { description = "Cloudflare API token", required = true }
KUBERNETES_SOPS_AGE_KEY = { description = "Age private key used to decrypt Kubernetes SOPS resources", required = true }

[scopes.dev-shell]
secrets = ["PROXMOX_VE_API_TOKEN", "CLOUDFLARE_API_TOKEN"]

[scopes.bootstrap]
secrets = ["PROXMOX_VE_API_TOKEN", "KUBERNETES_SOPS_AGE_KEY"]
