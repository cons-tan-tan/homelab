---
name: Set up Nix and Hestia
description: Install Nix and start the repository's pinned Hestia cache daemon

runs:
  using: composite
  steps:
    - name: Install Nix
      uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35
      with:
        enable_kvm: false

    - name: Start Hestia
      uses: Mic92/hestia@b21a1aaf8c3d5c2e430c9ba278c0f78abd46a320 # v3.0.0
      with:
        version: v3.0.0
        upstream-cache-filter: true
        upstream-cache-key-names: cache.nixos.org-1
