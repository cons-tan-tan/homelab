---
name: Set up Nix and Hestia
description: Install Nix and start the repository's pinned Hestia cache daemon

runs:
  using: composite
  steps:
    - name: Install Nix
      uses: nixbuild/nix-quick-install-action@v35
      with:
        enable_kvm: false
        nix_conf: |
          extra-substituters = https://cache.numtide.com?priority=50
          extra-trusted-public-keys = niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g=

    - name: Start Hestia
      uses: Mic92/hestia@v3.0.0
      with:
        version: v3.0.0
        upstream-cache-filter: true
        upstream-cache-key-names: cache.nixos.org-1 niks3.numtide.com-1
