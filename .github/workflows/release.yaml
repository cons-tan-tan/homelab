---
name: Release

on:
  # Only successful push or manual CI runs on the default branch reach the
  # write-capable job below; PR head revisions are never consumed here.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows:
      - CI
    branches:
      - main
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: release-images
  cancel-in-progress: true

jobs:
  images:
    name: Image / ${{ matrix.name }}
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      (github.event.workflow_run.event == 'push' ||
       github.event.workflow_run.event == 'workflow_dispatch') &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch &&
      github.event.workflow_run.head_sha == github.sha
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: minecraft-admin
            package: minecraft-admin-image
            image: ghcr.io/cons-tan-tan/minecraft-admin
    permissions:
      actions: read
      contents: read
      packages: write
    steps:
      - parallel:
          - name: Checkout
            uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            with:
              persist-credentials: false
              ref: ${{ github.event.workflow_run.head_sha }}

          - name: Set up Nix and Hestia
            uses: $/.github/actions/setup-hestia

      - parallel:
          - name: Build image
            env:
              INSTALLABLE: .#${{ matrix.package }}
            run: nix build "$INSTALLABLE"

          - name: Install image publisher
            run: nix profile add --inputs-from . nixpkgs#crane

      - name: Publish image
        env:
          GHCR_TOKEN: ${{ github.token }}
          IMAGE: ${{ matrix.image }}
          DOCKER_CONFIG: ${{ runner.temp }}/crane-docker-config
          IMAGE_TAR: ${{ runner.temp }}/image.tar
          SOURCE_REVISION: ${{ github.event.workflow_run.head_sha }}
        run: |
          trap 'rm -f -- "$IMAGE_TAR"; rm -rf -- "$DOCKER_CONFIG"' EXIT
          mkdir -p "$DOCKER_CONFIG"
          printf '%s' "$GHCR_TOKEN" | crane auth login \
            --username "$GITHUB_ACTOR" \
            --password-stdin \
            ghcr.io
          archive="$(readlink -f result)"
          gzip -dc "$archive" > "$IMAGE_TAR"
          crane push "$IMAGE_TAR" "$IMAGE:sha-$SOURCE_REVISION"
          crane tag "$IMAGE:sha-$SOURCE_REVISION" main
