---
name: Release

on:
  workflow_call:

permissions:
  contents: read

jobs:
  images:
    name: Image / ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: minecraft-admin
            package: minecraft-admin-image
            image: ghcr.io/cons-tan-tan/minecraft-admin
    permissions:
      actions: read
      contents: read
      packages: write
    steps:
      - parallel:
          - name: Checkout
            uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            with:
              persist-credentials: false

          - name: Set up Nix and Hestia
            uses: $/.github/actions/setup-hestia

      - parallel:
          - name: Build image
            env:
              INSTALLABLE: .#${{ matrix.package }}
            run: nix build "$INSTALLABLE"

          - name: Install image publisher
            run: nix profile add --inputs-from . nixpkgs#crane

      - name: Publish image if changed
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ matrix.image }}
          DOCKER_CONFIG: ${{ runner.temp }}/crane-docker-config
          IMAGE_TAR: ${{ runner.temp }}/image.tar
          REMOTE_DIGEST_ERROR: ${{ runner.temp }}/remote-digest-error
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          trap 'rm -f -- "$IMAGE_TAR" "$REMOTE_DIGEST_ERROR"; rm -rf -- "$DOCKER_CONFIG"' EXIT
          mkdir -p "$DOCKER_CONFIG"
          printf '%s' "$GH_TOKEN" | crane auth login \
            --username "$GITHUB_ACTOR" \
            --password-stdin \
            ghcr.io
          archive="$(readlink -f result)"
          gzip -dc "$archive" > "$IMAGE_TAR"

          local_digest="$(crane digest --tarball "$IMAGE_TAR")"
          if remote_digest="$(crane digest "$IMAGE:main" 2>"$REMOTE_DIGEST_ERROR")"; then
            if [[ "$local_digest" == "$remote_digest" ]]; then
              echo "$IMAGE:main is already $local_digest; skipping release"
              exit 0
            fi
          elif ! grep -Eq 'MANIFEST_UNKNOWN|NAME_UNKNOWN' "$REMOTE_DIGEST_ERROR"; then
            cat "$REMOTE_DIGEST_ERROR" >&2
            exit 1
          fi

          current_revision="$(
            gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$DEFAULT_BRANCH" \
              --jq '.object.sha'
          )"
          if [[ "$SOURCE_REVISION" != "$current_revision" ]]; then
            echo "Default branch advanced to $current_revision; skipping stale release $SOURCE_REVISION"
            exit 0
          fi

          crane push "$IMAGE_TAR" "$IMAGE:sha-$SOURCE_REVISION"
          crane tag "$IMAGE@$local_digest" main
          echo "Published $IMAGE:main at $local_digest"
