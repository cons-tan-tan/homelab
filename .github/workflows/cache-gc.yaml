---
name: Cache GC

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
    inputs:
      dry-run:
        description: Plan deletions without changing the cache
        required: false
        default: false
        type: boolean

concurrency:
  group: hestia-gc
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  gc:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: write
      contents: read
    steps:
      - name: Set up Nix and Hestia
        uses: $/.github/actions/setup-hestia

      - name: Run Hestia garbage collection
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          "$HESTIA_BIN" gc
          ${{ inputs.dry-run && '--dry-run' || '' }}
