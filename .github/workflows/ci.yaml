---
name: CI

on:
  push:
    branches:
      - main
  pull_request: {}
  workflow_dispatch: {}

permissions:
  actions: read
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  flake-eval:
    name: Flake / all systems / evaluate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - parallel:
          - name: Checkout
            uses: actions/checkout@v7.0.1
            with:
              persist-credentials: false

          - name: Install Nix
            uses: nixbuild/nix-quick-install-action@v35
            with:
              enable_kvm: false

      - name: Evaluate flake
        run: nix flake check --all-systems --no-build

  checks:
    name: Checks / x86_64-linux / build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - parallel:
          - name: Checkout
            uses: actions/checkout@v7.0.1
            with:
              persist-credentials: false

          - name: Set up Nix and Hestia
            uses: $/.github/actions/setup-hestia

      - name: Build checks
        run: nix flake check --keep-going --option system x86_64-linux

  release:
    name: Release
    needs:
      - flake-eval
      - checks
    if: >-
      (github.event_name == 'push' ||
       github.event_name == 'workflow_dispatch') &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    permissions:
      actions: read
      contents: read
      packages: write
    uses: $/.github/workflows/release.yaml
