---
name: Build image

on:
  workflow_call:
    inputs:
      package:
        description: Nix flake package that produces a gzip-compressed Docker archive
        required: true
        type: string
      ref:
        description: Git revision to check out and build
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - parallel:
          - name: Checkout
            uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            with:
              persist-credentials: false
              ref: ${{ inputs.ref }}

          - name: Set up Nix and Hestia
            uses: $/.github/actions/setup-hestia

      - name: Build image
        env:
          INSTALLABLE: .#${{ inputs.package }}
        run: nix build "$INSTALLABLE"
